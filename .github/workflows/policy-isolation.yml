name: Policy isolation

on:
  pull_request:
    branches: [main, "draft/**"]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  docker-policy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      GENESIS_POLICY_SMOKE_IMAGE: genesis-policy-smoke:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-deps -r tests/requirements-schema.lock
      - run: docker build --tag genesis-policy-smoke:ci tests/fixtures/policy_smoke
      - name: Verify policy image with the runner environment
        run: |
          docker image inspect --format '{{.Id}} {{json .Config.Volumes}}' "$GENESIS_POLICY_SMOKE_IMAGE"
          env -i PATH="$PATH" docker image inspect --format '{{.Id}} {{json .Config.Volumes}}' "$GENESIS_POLICY_SMOKE_IMAGE"
      - run: python -m unittest discover -s tests -p test_evaluator_isolation.py -v
