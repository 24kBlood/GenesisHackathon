name: Bootstrap CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check PR whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD
      - name: Check repository documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "README.md",
              "CONTRIBUTING.md",
              "docs/ADR/0000-context.md",
              ".github/CODEOWNERS",
              ".github/LABELS.md",
              ".github/PULL_REQUEST_TEMPLATE.md",
          ]
          required += [
              f".github/ISSUE_TEMPLATE/{name}.yml"
              for name in ("task", "rfc", "improvement", "bug", "leak")
          ]
          for name in required:
              if not Path(name).read_text(encoding="utf-8").strip():
                  raise SystemExit(f"Empty file: {name}")
          print(f"Verified {len(required)} required UTF-8 bootstrap files")
          PY
