name: Data contract

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - 'draft/**'
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps -r tests/requirements-schema.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Verify installed wheel from outside the checkout
        run: |
          unset PYTHONPATH
          wheel_dir="$(mktemp -d)"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          python -m venv "$wheel_dir/venv"
          "$wheel_dir/venv/bin/python" -m pip install --no-deps -r tests/requirements-schema.lock "$wheel_dir"/*.whl
          episodes=(data/dev/episode-*)
          episode="${episodes[0]##*/}"
          cd "$wheel_dir"
          venv/bin/genesis verify --all
          venv/bin/genesis run-policy "$episode" --policy simple_reconciliation
