[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-rl"
version = "1.0.0"
description = "Verifiable, deterministic FinTech RL environment for training and evaluating financial audit agents (pure Python stdlib, offline-capable)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Genesis Hackathon FinTech RL Audit Team" }
]
keywords = [
  "reinforcement-learning",
  "fintech",
  "financial-audit",
  "rl-environment",
  "gymnasium",
  "synthetic-data",
  "verifiable-rewards"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Office/Business :: Financial :: Accounting"
]
dependencies = []

[project.scripts]
audit-rl = "audit_rl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["audit_rl*"]
